<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Marius Nel</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">
<script>
(function(){try{var t=localStorage.getItem("mn-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<!-- Sub-pages of the old Notion site (Books, Book 1-6, Lunch & Learn, Skills)
     were shared as www.marius-nel.com/<Title>-<32 hex id>. The Books page now
     lives on this site at /books/ (NEXAA-114), so its old id forwards there —
     relative to wherever this site is mounted, because the staging URL sits
     under /marius-nel/. Every other id keeps forwarding to Notion, which still
     serves those pages at its own hostname, until phase 2 ports them. -->
<script>
(function(){
  var m = /^(.*\/)([A-Za-z0-9%._-]*([0-9a-f]{32}))\/?$/.exec(location.pathname);
  if (!m) return;
  var moved = { "3c5a3189063f8018b995f3a4f57f4dca": "books/" };
  if (moved[m[3]]) location.replace(m[1] + moved[m[3]]);
  else location.replace("https://nel-id-au.notion.site/" + m[2] + location.search);
})();
</script>
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
  .nf .eyebrow { margin-bottom: 1rem; }
</style>
</head>
<body>
<main class="nf">
  <div>
    <p class="eyebrow">Error 404</p>
    <h1>Page not found</h1>
    <p class="lede" style="margin-inline:auto">That page doesn’t exist — or it moved when the site did.</p>
    <p class="lede" style="margin-inline:auto">Looking for the books or the Lunch &amp; Learn material? They are on the <a href="books/">Books page</a>.</p>
    <p><a class="btn btn-primary" href="./">Back to the homepage</a></p>
  </div>
</main>
</body>
</html>
