<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Marius Nel</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">
<script>
(function(){try{var t=localStorage.getItem("mn-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<!-- Sub-pages of the old Notion site (Books, Book 1-6, Lunch & Learn, Skills)
     were shared as www.marius-nel.com/<Title>-<32 hex id>. Notion keeps serving
     them at its own hostname after the domain moves, so forward those paths
     there rather than dead-ending links already in people's inboxes. -->
<script>
(function(){
  var m = /^\/[A-Za-z0-9%._-]*[0-9a-f]{32}\/?$/.exec(location.pathname);
  if (m) location.replace("https://nel-id-au.notion.site" + location.pathname + location.search);
})();
</script>
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
  .nf .eyebrow { margin-bottom: 1rem; }
</style>
</head>
<body>
<main class="nf">
  <div>
    <p class="eyebrow">Error 404</p>
    <h1>Page not found</h1>
    <p class="lede" style="margin-inline:auto">That page doesn’t exist — or it moved when the site did.</p>
    <p class="lede" style="margin-inline:auto">Looking for the books or the Lunch &amp; Learn material? They are at <a href="https://nel-id-au.notion.site/Books-3c5a3189063f8018b995f3a4f57f4dca">nel-id-au.notion.site</a>.</p>
    <p><a class="btn btn-primary" href="./">Back to the homepage</a></p>
  </div>
</main>
</body>
</html>
